services:
  postgres:
    image: postgres:16-alpine
    container_name: traceiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceiq
      POSTGRES_PASSWORD: traceiq_local_only
      POSTGRES_DB: traceiq
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traceiq -d traceiq']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: traceiq_postgres_data
